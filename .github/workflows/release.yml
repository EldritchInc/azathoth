name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      final: ${{ steps.version.outputs.final }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the declared version
        id: version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          #
          # A final release is X.Y.Z. A pre-release, such as 1.4.0a1, is
          # published to PyPI only: it never becomes an image (ADR 0120).
          #
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "final=true" >> "${GITHUB_OUTPUT}"
          else
            echo "final=false" >> "${GITHUB_OUTPUT}"
          fi

      #
      # azathoth-mcp is released with Azathoth, at the same version (ADR 0111).
      #
      - name: Require azathoth-mcp to declare the same version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mcp_version="$(python -c "import tomllib; print(tomllib.load(open('packages/azathoth-mcp/pyproject.toml', 'rb'))['project']['version'])")"
          if [ "${mcp_version}" != "${VERSION}" ]; then
            echo "azathoth-mcp declares ${mcp_version}, not ${VERSION}." >&2
            exit 1
          fi

      - name: Require the tag to match the declared version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the declared version ${VERSION}." >&2
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
          python -m build packages/azathoth-mcp --outdir dist

      - name: Install the built wheels into a clean environment
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "${RUNNER_TEMP}/release-check"
          "${RUNNER_TEMP}/release-check/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          test "$("${RUNNER_TEMP}/release-check/bin/azathoth" --version)" = "azathoth ${VERSION}"
          "${RUNNER_TEMP}/release-check/bin/azathoth" --help > /dev/null
          test "$("${RUNNER_TEMP}/release-check/bin/azathoth-mcp" --version)" = "azathoth-mcp ${VERSION}"
          "${RUNNER_TEMP}/release-check/bin/azathoth-mcp" serve --help > /dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/azathoth-ai

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/azathoth-ai

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-image:
    name: Publish the container image
    needs:
      - build
      - publish-pypi
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.build.outputs.final == 'true'
      && (needs.publish-pypi.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE: ghcr.io/eldritchinc/azathoth
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Name the image's tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${VERSION%.*}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: azathoth:release
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Require the image to report the declared version
        run: |
          reported="$(docker run --rm azathoth:release --version)"
          if [ "${reported}" != "azathoth ${VERSION}" ]; then
            echo "The image reports ${reported}, not azathoth ${VERSION}." >&2
            exit 1
          fi
          served="$(docker run --rm --entrypoint /usr/bin/tini azathoth:release -- azathoth-mcp --version)"
          if [ "${served}" != "azathoth-mcp ${VERSION}" ]; then
            echo "The image's MCP server reports ${served}, not azathoth-mcp ${VERSION}." >&2
            exit 1
          fi

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for every architecture, and push on a tag
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      #
      # Sign the image by its digest, which covers every tag pushed with it,
      # keylessly: the signature names this workflow and the tag it ran for
      # (ADR 0109).
      #
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed image
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

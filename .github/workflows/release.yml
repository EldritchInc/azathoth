name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the declared version
        id: version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Require the tag to match the declared version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the declared version ${VERSION}." >&2
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Install the built wheel into a clean environment
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "${RUNNER_TEMP}/release-check"
          "${RUNNER_TEMP}/release-check/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          test "$("${RUNNER_TEMP}/release-check/bin/azathoth" --version)" = "azathoth ${VERSION}"
          "${RUNNER_TEMP}/release-check/bin/azathoth" --help > /dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/azathoth-ai

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/azathoth-ai

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-image:
    name: Publish the container image
    needs:
      - build
      - publish-pypi
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && (needs.publish-pypi.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/eldritchinc/azathoth
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Name the image's tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${VERSION%.*}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: azathoth:release
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Require the image to report the declared version
        run: |
          reported="$(docker run --rm azathoth:release --version)"
          if [ "${reported}" != "azathoth ${VERSION}" ]; then
            echo "The image reports ${reported}, not azathoth ${VERSION}." >&2
            exit 1
          fi

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for every architecture, and push on a tag
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

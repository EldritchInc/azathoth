[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azathoth-ai"
version = "1.0.0"
description = "An empirical optimization engine for context-aware AI workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eris Discordia Montano" }
]
keywords = [
    "artificial-intelligence",
    "llm",
    "prompt-optimization",
    "model-routing",
    "evaluation",
    "workflow-optimization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed"
]
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.18,<5",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/EldritchInc/azathoth"
Repository = "https://github.com/EldritchInc/azathoth"
Issues = "https://github.com/EldritchInc/azathoth/issues"
Funding = "https://patreon.com/ErisDiscordiaM"

[project.scripts]
azathoth = "azathoth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azathoth = ["py.typed", "standard/tools/*.json"]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
bedrock = [
    "boto3>=1.39,<2",
]
dev = [
    "boto3>=1.39,<2",
    "build",
    "mypy",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "psycopg[binary]>=3.2,<4",
    "pytest",
    "pytest-cov",
    "ruff",
    "setuptools>=68",
    "types-jsonschema",
    "wheel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
